# analyzeStocks の開発環境定義（mise）
#
# このツールはサードパーティ製パッケージを使わない（本体もテストも標準ライブラリのみ）。
# よって requirements.txt / uv.lock は不要で、mise が管理する「依存」は
# Python インタプリタの版のみ。cd でこのディレクトリに入ると下記 Python へ自動切替する。
#
# よく使うコマンド:
#   mise install   # Python を導入（初回のみ・プリビルド版を取得、コンパイル不要）
#   mise run test  # 単体テスト（unittest, ネットワーク非依存）
#   mise run screen -- --month 2025-09 --plan free   # 配当落ちスクリーニング

[tools]
# 標準ライブラリのみ・3.10+ 構文は不使用のため実質 3.8+ で動くが、版を固定して再現性を確保。
# python はパッチバージョンまで完全固定する（"3.14" のような浮動指定は使わない）。
# 浮動指定だと同じコミットでも解決タイミング次第で実バージョンが変わりうるため、宣言そのものを
# 実バージョンに一致させ、ここを読めば入る版が判るようにする。
#
# 版を上げるときは本ファイルの値を書き換える（mise.lock 側が勝手に上がることはない）。
# lockfile 有効化は本ファイルではなくグローバル設定（~/.config/mise/config.toml の
# [settings] lockfile = true）から供給される。CI は `mise install --locked` で明示指定するため
# 設定値には依存しない。完全固定にしても mise.lock は不要にならない。プラットフォーム別の
# URL / checksum は lock にしか無く、`--locked` はそれを参照するため。
#
# 【重要】版数を上げたら必ず次を実行すること:
#   mise lock python -p linux-arm64,linux-arm64-musl,linux-x64,linux-x64-musl,macos-arm64,macos-x64,windows-x64
# `mise install` だけだと mise.lock の platforms.* が消える。python でも実測済みで、
# 解決される版が変わったときだけ 7 件が全消失し version + backend の 2 行だけになる
# （版が変わらなければ保持される）。financialStatements の node 24→26 と同じ挙動。
# 復元し忘れると `mise install --locked` が "No lockfile URL found" により失敗する
# （このツールは deploy.yml の対象外なので CI は落ちないが、他メンバー・他プラットフォームの
# ローカル環境が壊れる）。
# 実行後は platforms.* の数を更新前と必ず比較すること（このツールは 7 件が正常）。
python = "3.15.2"

[tasks.test]
description = "単体テスト（unittest, ネットワーク非依存）"
run = "python -m unittest discover -p 'test_*.py' -v"

[tasks.screen]
description = "配当落ちスクリーニング（例: mise run screen -- --month 2025-09 --plan free）"
run = "python screen_dividend_drop.py"

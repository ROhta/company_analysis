name: Deploy financialStatements to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:

# GitHub Pagesへのデプロイに必要な権限設定
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行を1つに制限（進行中のデプロイはキャンセルしない）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # mise は CI 環境を検知すると設定を自動 trust するため MISE_TRUSTED_CONFIG_PATHS 等は不要。
    # 全 action は SHA 固定（リポジトリ設定の "Require actions to be pinned to a full-length commit SHA" 対応）。
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # node / pnpm のバージョンは financialStatements/mise.toml + mise.lock を単一ソースとして
      # mise で導入する（ローカル開発と完全に同一の版になる）。
      # ここには具体的なバージョンも宣言スタイルも書かない。書けば単一ソース側の変更に追随できず
      # 必ずドリフトする（実際に過去 2 回陳腐化させた）。版を知りたい場合は上記 2 ファイルを見ること。
      # mise 本体も固定する。未指定だと最新リリースが入るため、lockfile を解釈する側だけが
      # 浮動して再現性が崩れる。値は実 CI ログで確認した版のみを書く（推測で書かない）。
      - name: Setup mise (node / pnpm)
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          working_directory: financialStatements
          version: "2026.7.14"

      - name: Install dependencies
        working-directory: financialStatements
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: financialStatements
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy/financialStatements
          cp -r financialStatements/dist/* deploy/financialStatements/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'deploy'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
